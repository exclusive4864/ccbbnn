<script>
const lessons = [
{
id:'positive', title:'Positive / Negative', thai:'ตัดสินภาพรวม', topic:'การเรียนออนไลน์',
prompt:'More university students are taking courses online instead of attending classes on campus. Is this a positive or negative development?',
translation:'นักศึกษามหาวิทยาลัยเรียนออนไลน์แทนการเข้าชั้นเรียนมากขึ้น แนวโน้มนี้เป็นการเปลี่ยนแปลงในทางบวกหรือทางลบ?',
task:'ต้องตัดสินแนวโน้มโดยรวม จะยอมรับข้อเสียก็ได้ แต่ต้องบอกว่าทำไมด้านที่เลือกจึงสำคัญกว่า อย่าจบแค่ว่ามีทั้งดีและเสีย',
plan:['ใคร: นักศึกษามหาวิทยาลัย ไม่ใช่เด็กทุกวัย','ตัดสิน: โดยรวมเป็นบวก หากยังได้รับการสนับสนุน','เหตุผลหลัก: เข้าถึงการศึกษา → คนทำงานเรียนต่อได้','ข้อจำกัด: ขาดปฏิสัมพันธ์ → ต้องมีการพบผู้สอน','ชั่งน้ำหนัก: โอกาสที่เพิ่มขึ้นเทียบกับปัญหาที่แก้ได้'],
transfer:'More employees are working from home instead of travelling to an office. Is this a positive or negative development?',
recall:'ก่อนอ่าน: เขียนเหตุผลหนึ่งข้อว่าทำไมการเรียนออนไลน์จึงเป็นบวก พร้อมอธิบายว่าใครได้ประโยชน์และได้อย่างไร',
models:[
{band:7, name:'จุดยืนชัด • เหตุผลตรง', stance:'เป็นบวก: ยืดหยุ่นและเปิดโอกาส',
paragraphs:[
`An increasing number of university students now study online rather than travel to a campus. Although this change can reduce contact with teachers and classmates, I believe it is a positive development overall because it makes higher education more accessible and allows students to organise their time more easily.`,
`The main benefit is that online courses give more people the opportunity to study. Students who live far from a university do not have to move to another city, which can be expensive. For example, someone in a rural area could complete a business course while continuing to live with their family. This would reduce their living costs and make a degree more affordable. Online education can therefore help people who might otherwise be unable to attend university. It also allows working adults to gain qualifications without giving up their income.`,
`Another advantage is flexibility. Recorded lessons allow students to study at a suitable time and watch difficult explanations again. A student with a part-time job, for instance, could review a lecture after work. However, studying alone can be difficult, especially when students do not understand a topic. They may also have fewer opportunities to make friends. Universities should therefore provide regular online discussions and clear ways to contact teachers. These measures would help students receive support while still enjoying the convenience of learning at home. Students would also need to follow a weekly study plan rather than leave all their work until the final deadline.`,
`In conclusion, I consider the growth of online university courses to be positive. While reduced personal contact is a disadvantage, better access and greater flexibility make this approach valuable, provided that universities offer appropriate support.`],
notes:['เปิดด้วยการถอดความโจทย์ แล้วบอก positive overall ทันที','ขยาย access ด้วยกลุ่มคน → ค่าใช้จ่าย → โอกาสเรียน ไม่ใช่ลิสต์ข้อดีเฉย ๆ','เชื่อม flexibility กับตัวอย่าง แล้วรับข้อเสีย แต่ประโยคเรื่องแผนรายสัปดาห์เริ่มกระจายจุดสนใจ','ย้ำคำตอบเดิมและเงื่อนไข ไม่มีเหตุผลใหม่'],
good:'อ่านตามง่าย ตัวอย่างคนทำงานและคนอยู่ไกลช่วยให้เห็นประโยชน์ชัด โครงนี้เหมาะเป็นต้นแบบชิ้นแรก',
limit:'ข้ออ้างว่าเรียนออนไลน์ทำให้ปริญญาถูกลงยังขึ้นอยู่กับค่าเล่าเรียนจริง ย่อหน้า 3 รวมทั้งเวลา เพื่อน และวินัย ทำให้โฟกัสกว้าง',
upgrade:'จำกัดข้ออ้างเป็นการประหยัดค่าที่พักและค่าเดินทาง แล้วเลือกอธิบายปัญหาปฏิสัมพันธ์ให้ลึกเพียงเรื่องเดียว',
criteria:['TR: ตอบภาพรวมและมีเหตุผล แต่การชั่งน้ำหนักยังสั้น','CC: ลำดับชัด บางช่วงใช้ Another / However เป็นหลัก','LR: ใช้ gain qualifications และ living costs ตรงบริบท','GRA: มี although, who, provided that ให้ฝึกโดยไม่ต้องเขียนยาวทุกประโยค']},
{band:8,name:'ชั่งน้ำหนัก • จำกัดข้ออ้าง',stance:'เป็นบวก: ประโยชน์ด้านการเข้าถึงเหนือข้อเสียที่ลดได้',
paragraphs:[
`The shift from campus-based teaching to online university courses has made the location of a student less decisive in determining access to education. I regard this as a largely positive development: it removes significant barriers to participation, although its value depends on universities maintaining meaningful contact with their students.`,
`The strongest argument in favour of this change is that it opens higher education to people whose circumstances prevent regular campus attendance. A parent working full time, for example, may be able to watch recorded lectures in the evening but cannot travel to a university every morning. For such a learner, the relevant comparison is not between an online course and an ideal classroom experience; it is between studying remotely and not studying at all. Avoiding relocation and daily travel can also reduce the additional costs of obtaining a qualification, even where tuition fees remain unchanged. This makes the practical benefits substantial.`,
`Nevertheless, increased access does not automatically produce effective learning. Students who rarely speak to a lecturer may allow misunderstandings to persist, while limited contact with classmates can weaken their motivation. These are serious drawbacks, particularly for those beginning university. However, they arise partly from how courses are organised rather than from distance itself. Scheduled tutorials, timely feedback and small discussion groups can provide opportunities to ask questions and establish a study routine. Such arrangements require investment, but they allow universities to preserve much of the support associated with campus teaching without removing the flexibility that remote learners need.`,
`On balance, the expansion of online courses is beneficial because it enables participation that would otherwise be impossible. The risk of isolation should shape course design, but it is not a sufficient reason to reject a development that broadens educational opportunity.`],
notes:['ใช้ largely เพื่อไม่เหมารวมว่าออนไลน์ดีทุกกรณี','เปลี่ยนฐานเปรียบเทียบ: สำหรับผู้ติดข้อจำกัดคือได้เรียน vs ไม่ได้เรียน และแยก tuition ออกจากค่าใช้จ่ายแฝง','แยกข้อเสียของระยะทางออกจากข้อเสียของการออกแบบหลักสูตร พร้อมระบุต้นทุนของทางแก้','ชั่งน้ำหนักจริงว่า risk ไม่พอลบล้างประโยชน์ด้านโอกาส'],
good:'เหตุผลต่อเนื่องขึ้นและแม่นยำกว่า: ไม่กล่าวว่าค่าเทอมลดเสมอ และอธิบายว่าทำไมการเข้าถึงจึงสำคัญ',
limit:'เน้นผู้ที่เข้าเรียนในมหาวิทยาลัยไม่ได้เป็นหลัก ยังไม่ได้พิจารณาวิชาที่ต้องใช้ห้องปฏิบัติการ เหมาะกับข้อสรุป largely มากกว่าดีทุกกรณี',
upgrade:'เพิ่มการจำแนกระหว่างการเรียนทฤษฎีกับทักษะที่ต้องฝึกหน้างานโดยไม่ให้หลุดจากคำถามเรื่องแนวโน้ม',
criteria:['TR: ชั่งน้ำหนักด้วยสถานการณ์ของผู้เรียน','CC: such a learner / these drawbacks เชื่อมความหมายข้ามประโยค','LR: barriers to participation และ timely feedback สื่อความเฉพาะ','GRA: ใช้ relative clauses และ even where อย่างมีหน้าที่']},
{band:9,name:'นิยามเกณฑ์ • แยกเงื่อนไข',stance:'เป็นบวกเมื่อขยายโอกาส แต่ไม่ทดแทนประสบการณ์ทุกชนิด',
paragraphs:[
`As university teaching moves online, it is tempting to judge the change solely by what disappears from campus life. A more useful test is whether students gain worthwhile educational opportunities that they would otherwise lack. By this measure, the trend is positive overall, although remote provision should not be treated as an equally suitable replacement for every form of learning.`,
`Its principal value lies in separating access to a degree from the ability to be in a particular place at a particular time. A full-time carer, for instance, may be perfectly capable of university study yet unable to attend daily lectures. If those lectures are available remotely and can be revisited, an obstacle unrelated to academic ability is removed. The benefit extends beyond convenience: a student previously excluded by personal circumstances can now participate. This does not imply that every online course is affordable or accessible, since reliable equipment and an internet connection are still required. It does explain why the expansion can be socially valuable even when individual courses are imperfect.`,
`The qualification concerns what remote teaching can realistically replace. Discussion of a historical argument can be organised online, whereas learning to handle laboratory equipment requires supervised physical practice. Likewise, students who have not developed independent study habits may need scheduled interaction rather than a library of recordings. These distinctions support selective use of campus sessions and structured tutorials, not a general retreat from online education. The decisive issue is whether the teaching arrangement matches the learning objective. Where it does, reduced attendance is a reasonable cost of broader participation; where it does not, convenience cannot justify an inferior educational experience.`,
`Overall, the growth of online university study represents progress because it weakens unnecessary barriers to participation. Its benefits are greatest when institutions expand access while retaining the physical practice and personal support that particular learners and subjects require.`],
notes:['ประกาศเกณฑ์ตัดสิน worthwhile opportunities ก่อนวางจุดยืน','แยกความสามารถทางวิชาการจากข้อจำกัดส่วนตัว แล้วรับเงื่อนไขอุปกรณ์และอินเทอร์เน็ต','ใช้ประวัติศาสตร์ vs ห้องแล็บ ทำให้เงื่อนไขเป็นรูปธรรม ไม่ใช่ depends ลอย ๆ','สรุปที่สอดคล้องกับเกณฑ์ตั้งแต่ต้น'],
good:'คิดแบบแบ่งกรณีและระบุเกณฑ์ตัดสินชัด ความซับซ้อนอยู่ที่ความหมาย ไม่ใช่การประดับศัพท์หายาก',
limit:'ต้องควบคุมขอบเขตอย่างดี ถ้าขยายทุกข้อยกเว้นจะกลายเป็นบทความที่ลังเลและใช้เวลาเกิน ตัวอย่างนี้เป็นแบบศึกษาที่มุ่งคุณลักษณะ Band 9 ไม่ใช่การรับรองคะแนน',
upgrade:'ยืมวิธีถามว่า “ดีสำหรับใคร ภายใต้เงื่อนไขใด” แล้วเขียนด้วยคำที่ตัวเองควบคุมได้ ไม่ต้องยืมทุกประโยค',
criteria:['TR: นิยามเกณฑ์และทดสอบกับกรณีที่แตกต่าง','CC: แต่ละย่อหน้าพัฒนาข้อสรุปเดียวกัน','LR: supervised physical practice และ learning objective ระบุสิ่งที่ต้องการสื่อ','GRA: เปรียบต่างและวางเงื่อนไขอย่างยืดหยุ่น']}
]},
{
id:'discuss',title:'Discuss both views',thai:'เข้าใจสองฝ่าย + ยืนจุดของเรา',topic:'งบประมาณการเดินทาง',
prompt:'Some people think governments should spend more money on public transport, while others believe that building more roads is more important. Discuss both views and give your own opinion.',
translation:'บางคนคิดว่ารัฐควรเพิ่มงบขนส่งสาธารณะ ขณะที่อีกฝ่ายเห็นว่าการสร้างถนนเพิ่มสำคัญกว่า อภิปรายทั้งสองมุมมองและให้ความเห็นของคุณ',
task:'มี 3 งาน: อธิบายเหตุผลฝ่ายขนส่งสาธารณะ อธิบายฝ่ายถนนอย่างเป็นธรรม และให้ความเห็นของเรา การบอกว่าอีกฝ่ายผิดโดยไม่อธิบายเหตุผลยังไม่พอ',
plan:['ฝ่ายรถสาธารณะ: ขนคนจำนวนมากในพื้นที่จำกัด','ฝ่ายถนน: รถสินค้าและพื้นที่ห่างไกลต้องพึ่งถนน','จุดยืน: เมืองหนาแน่นควรให้ขนส่งสาธารณะมาก่อน','ขยาย: ถนนใหม่เพิ่มพื้นที่ แต่ไม่ได้ลดจำนวนรถเสมอ','สรุป: มีลำดับความสำคัญพร้อมข้อยกเว้น ไม่ใช่ 50/50 โดยอัตโนมัติ'],
transfer:'Some people think schools should prioritise academic subjects, while others believe practical skills are more important. Discuss both views and give your own opinion.',
recall:'ลองอธิบายเหตุผลของฝ่าย “สร้างถนนเพิ่ม” ให้ดีที่สุดหนึ่งข้อ แม้คุณจะเห็นด้วยกับขนส่งสาธารณะ',
models:[
{band:7,name:'สองฝ่าย • ความเห็นชัด',stance:'ให้ขนส่งสาธารณะมาก่อนในเมือง',paragraphs:[
`People have different views about whether governments should invest more in public transport or construct additional roads. Both options can improve travel, but they serve different needs. In my opinion, public transport should usually receive greater priority in cities, although new roads are still necessary in some areas.`,
`On the one hand, better public transport can help large numbers of people travel at a reasonable cost. If buses and trains are reliable, commuters may choose them instead of driving. This can reduce traffic congestion and make journeys easier for everyone. For example, a frequent bus service connecting residential areas with workplaces would give workers a practical alternative to using a car. Public transport is also important for people who cannot drive, including some older residents and students. Investment in these services can therefore improve access to jobs and education.`,
`On the other hand, supporters of road construction argue that roads are essential for both private travel and business. Companies need to deliver goods, and buses also depend on a suitable road network. In rural areas, a new road may connect a village to a hospital or a market. These are important benefits that a city railway cannot provide. However, building more roads in busy cities may encourage more people to drive, so the extra space may not solve congestion for long. I therefore think that urban governments should improve existing bus and train services before expanding roads, while considering road projects where communities lack basic connections.`,
`In conclusion, roads support trade and connect isolated areas, whereas public transport helps many people travel efficiently. I would give priority to public transport in cities and reserve new road construction for places where it meets a clear need.`],
notes:['บอกความเห็นตั้งแต่ต้น ใช้ cities จำกัดบริบท','ไม่ได้บอกแค่ลดรถติด แต่แสดงเงื่อนไข reliable และตัวอย่างเส้นทางไปทำงาน','อธิบายฝ่ายถนนจริงก่อนโต้แย้ง ไม่ทำให้เป็นฝ่ายโง่','สรุปทั้งสองฝ่าย พร้อมลำดับที่เลือก'],
good:'ทำครบสามคำสั่ง ใช้ตัวอย่างใกล้ตัว จดจำหน้าที่ของแต่ละย่อหน้าได้ง่าย',limit:'วลี make journeys easier for everyone กว้างเกินไป และย่อหน้าถนนมีทั้งธุรกิจ ชนบท รถติด จึงยาวกว่าประเด็นหลัก',upgrade:'แทน everyone ด้วยกลุ่มที่อธิบายได้จริง และเลือกเกณฑ์ people moved / access เป็นแกนชั่งน้ำหนัก',criteria:['TR: ครบทั้งสองมุมและความเห็น','CC: โครง on the one hand / on the other hand ชัดแต่ค่อนข้างเห็นรอยต่อ','LR: traffic congestion / road network ใช้ได้ตรง','GRA: เงื่อนไข if และ whereas เชื่อมเหตุผล']},
{band:8,name:'เกณฑ์ลงทุน • ไม่แบ่งงบเท่ากัน',stance:'ลงทุนตามประโยชน์ต่อการเข้าถึง',paragraphs:[
`Debate over transport spending often contrasts investment in buses and railways with the construction of additional roads. Supporters of each approach identify legitimate needs. Nevertheless, I believe public transport deserves priority in densely populated areas, while road building is more defensible where basic connections are missing.`,
`The case for public transport rests on its ability to move many passengers without requiring each of them to use a separate vehicle. In a city with limited road space, a reliable bus route can offer commuters an alternative to driving while also serving residents who cannot afford a car. Consider workers travelling from the same suburb to a central business district: frequent services along that route could meet a shared need more efficiently than additional lanes used by individual motorists. These benefits depend on services being convenient and dependable, so funding must cover their operation as well as new infrastructure.`,
`Those who favour roads point out that transport needs are not confined to regular urban commuting. Freight vehicles, emergency services and people living in scattered communities all require adequate road access. A new connection between an isolated settlement and a regional centre could therefore have greater practical value than a bus service running along an unsuitable existing route. This is a strong argument for targeted road construction. It is less persuasive as a justification for continually widening city roads, because extra capacity can make driving more attractive and leave the original problem unresolved.`,
`My view is consequently that spending should reflect the main obstacle to mobility. Where roads already exist but congestion limits their usefulness, improving public transport is generally the better priority. Where communities lack a dependable connection at all, new roads may be essential. Recognising both needs does not require governments to divide their budgets equally between them.`],notes:['ยอมรับ legitimate needs ของสองฝ่าย แล้ววางบริบทที่เลือก','ขยายความจุพื้นที่ และเพิ่มเงื่อนไขงบเดินรถ ไม่ใช่สร้างรางแล้วจบ','แยก targeted road construction ออกจาก widening city roads ทำให้ไม่โจมตีถนนทุกแบบ','ใช้ obstacle to mobility เป็นเกณฑ์ร่วมในการให้ความเห็น'],good:'เปรียบเทียบบนปัญหาที่ต้องแก้จริง แทนการนับจำนวนข้อดี และให้ฝ่ายถนนมีกรณีที่ชนะได้',limit:'ใช้ข้อสมมุติเรื่อง extra capacity อย่างระมัดระวังด้วย can แต่ยังไม่ได้แสดงเงื่อนไขเรื่องบริการทดแทนในเมืองอย่างละเอียด',upgrade:'อธิบายความต่างระหว่างการเคลื่อนรถกับการพาคนไปถึงจุดหมาย และโยงกลับการจัดงบ',criteria:['TR: เหตุผลสองฝ่ายพัฒนาและเชื่อมความเห็น','CC: เหตุผลในบทสรุปต่อจากทั้งสองย่อหน้า','LR: densely populated areas / targeted road construction เฉพาะเจาะจง','GRA: ใช้ where เพื่อแบ่งสถานการณ์และ because เพื่ออธิบายกลไก']},
{band:9,name:'เปลี่ยนหน่วยคิด • ตัดสินตามบริบท',stance:'วัดการเข้าถึง ไม่ใช่จำนวนถนน',paragraphs:[
`Whether transport budgets should favour public transport or new roads depends partly on what the investment is meant to achieve. Both can improve access, but increasing the movement of vehicles is not always the same as helping people reach their destinations. I would prioritise public transport in established cities and support new roads where the absence of a connection is itself the central problem.`,
`Advocates of public transport have a compelling case where large numbers of people make similar journeys through limited space. A bus carrying many passengers uses that space more economically than a line of cars, while a usable network gives non-drivers access to employment and services. The important word, however, is usable. A railway that is too expensive or poorly connected to residential districts may attract few of those it is intended to help. The argument for greater spending is therefore strongest when investment creates a coherent service, including affordable fares and convenient connections, rather than merely an impressive construction project.`,
`The opposing view is persuasive where transport demand cannot readily be concentrated along shared routes. Farms need deliveries, emergency vehicles need reliable access, and isolated settlements may need an entirely new connection to regional facilities. In such circumstances, road construction provides a foundation on which other services also depend. This rationale does not transfer automatically to congested cities. Adding lanes may initially ease traffic, but if the improved driving conditions attract more car journeys, the benefit can diminish without substantially improving access for residents who do not drive.`,
`I therefore favour judging projects by the access they create rather than the infrastructure they add. This generally supports public transport as the urban priority, alongside carefully justified roads in underserved areas. Both perspectives identify real needs; the mistake would be to turn either into a universal spending rule.`],notes:['ตั้งคำถามเรื่องเป้าหมายงบ และแยก vehicles ออกจาก people','หยิบคำว่า usable มาขยายเป็นราคาและการเชื่อมต่อ ย่อหน้าจึงลึกแทนการเพิ่มเหตุผลใหม่เรื่อย ๆ','สร้างกรณีที่ฝ่ายถนนมีเหตุผล แล้วอธิบายว่าทำไมยกไปใช้กับเมืองตรง ๆ ไม่ได้','เชื่อม criteria เดิม ไม่สรุปเป็นกลางแบบละทิ้งจุดยืน'],good:'วางเกณฑ์เดียวแล้วประเมินทั้งสองฝ่าย ช่วยให้ความเห็นไม่เป็นแค่ประโยคที่แปะตอนจบ',limit:'ความคิดแบบเปลี่ยนหน่วยวัดต้องอธิบายให้เป็นรูปธรรม ถ้าลอกแค่ประโยคเปิดจะฟังนามธรรมเกินไป',upgrade:'ฝึกเขียน “เป้าหมายจริงคืออะไร” เป็นไทยก่อน แล้วให้ทุกตัวอย่างตอบเกณฑ์นั้น',criteria:['TR: สำรวจเหตุผลและขอบเขตของทั้งสองมุม','CC: แต่ละประเด็นกลับมาที่ access อย่างเป็นธรรมชาติ','LR: coherent service / underserved areas แม่นความหมาย','GRA: ความยาวประโยคหลากหลายและควบคุมข้อแม้']}
]},
{
id:'advantages',title:'Advantages / Disadvantages',thai:'ชั่งว่าข้อดีมากกว่าหรือไม่',topic:'การทำงานจากบ้าน',
prompt:'More companies are allowing employees to work from home. Do the advantages of this development outweigh the disadvantages?',
translation:'บริษัทอนุญาตให้พนักงานทำงานจากบ้านมากขึ้น ข้อดีของแนวโน้มนี้มีน้ำหนักมากกว่าข้อเสียหรือไม่?',
task:'คำว่า outweigh ต้องตัดสินน้ำหนัก ไม่ใช่เขียนข้อดีสองข้อและข้อเสียหนึ่งข้อแล้วนับจำนวน หากโจทย์ถามเพียง What are the advantages and disadvantages? ให้ตอบทั้งสองด้านโดยไม่จำเป็นต้องตัดสินว่าด้านใดชนะ',
plan:['ตัดสิน: ข้อดีมากกว่าในงานที่ทำทางไกลได้','ข้อเสียจริง: ประสานงานและฝึกพนักงานใหม่ยาก','ข้อดี: ประหยัดเวลาเดินทางทุกวันและยืดหยุ่น','เกณฑ์: ประโยชน์เกิดซ้ำบ่อยแค่ไหน ปัญหาแก้ได้ไหม','สรุป: ชนะด้วยเหตุผล ไม่ใช่จำนวนรายการ'],
transfer:'More people are buying goods online rather than in physical shops. Do the advantages of this development outweigh the disadvantages?',
recall:'ข้อดี 1 ข้ออาจชนะข้อเสีย 2 ข้อได้อย่างไร? ลองตอบโดยใช้ “ความถี่ของประโยชน์” หรือ “ความรุนแรงของผลเสีย”',
models:[
{band:7,name:'ข้อเสียก่อน • ข้อดีชนะอย่างไร',stance:'ข้อดีมากกว่า หากจัดการการสื่อสารได้',paragraphs:[
`Working from home is becoming more common as companies allow employees to complete their tasks remotely. This arrangement has disadvantages, particularly in communication, but I believe its advantages are greater for jobs that do not require a physical presence. It can save time and give workers more control over their daily lives.`,
`One disadvantage is that employees may find it harder to work with their colleagues. In an office, people can ask quick questions and discuss problems immediately. At home, they may have to wait for an email or arrange a video call. This can slow down a project, especially when several people need to make a decision together. New employees may also feel isolated because they have fewer chances to get to know the team. Companies therefore need regular meetings and a clear system for sharing information if they want remote work to succeed.`,
`However, the benefits can be substantial. Employees no longer need to spend time travelling to an office every day. Someone who normally travels for an hour each way could use that time to exercise, rest or look after their family. This can improve their work-life balance and reduce the stress of a long commute. Working from home may also allow people to concentrate better when they have a quiet space. Although not everyone has suitable conditions at home, those who do can benefit every working day. In my view, these regular gains are more important than communication problems that can often be reduced through better organisation.`,
`In conclusion, remote work can make teamwork more difficult, but its advantages generally outweigh this drawback in suitable jobs. Saving time and improving daily life are valuable benefits, provided that companies give employees the support they need to cooperate effectively.`],notes:['กำหนดขอบเขต suitable jobs ป้องกันเหมารวมทุกอาชีพ','ขยายข้อเสียจากวิธีถามงานไปสู่ความล่าช้าและคนใหม่','มีประโยคชั่งน้ำหนัก daily gains vs problems reduced ไม่ใช่แค่นับข้อดี','ตอบ outweigh ตรงคำถามและสอดคล้องกับบทนำ'],good:'โครงข้อเสียก่อนแล้วข้อดีเหมาะกับจุดยืนนี้ มีเหตุผลชั่งน้ำหนักให้เลียนแบบได้',limit:'กล่าวว่าการจัดระบบลดปัญหาได้ แต่ไม่ได้อธิบายว่าประชุมแบบใดช่วยงานที่ต้องตัดสินใจเร็ว อาจมองความยากง่ายเกินไป',upgrade:'ยอมรับต้นทุนของการแก้ปัญหา แล้วเปรียบเทียบกับเวลาที่ได้คืนอย่างต่อเนื่อง',criteria:['TR: ตัดสิน outweigh และสนับสนุน','CC: ลำดับ disadvantage → benefits → judgement ชัด','LR: work-life balance / physical presence ใช้ตรง','GRA: มี who, when และ provided that อย่างเป็นธรรมชาติ']},
{band:8,name:'ประโยชน์ซ้ำทุกวัน • ต้นทุนที่จัดการได้',stance:'ข้อดีมากกว่าในงานที่เหมาะกับทางไกล',paragraphs:[
`Allowing employees to work from home changes both how organisations coordinate tasks and how individuals organise their lives. For roles that can be performed remotely, I believe the advantages outweigh the disadvantages, chiefly because the daily benefits of avoiding a commute are substantial, whereas many coordination problems can be managed deliberately.`,
`The main costs concern cooperation and learning. Colleagues working in separate locations cannot rely on casual conversations to notice problems or exchange advice. This is particularly difficult for a new employee who may not know whom to ask for help. Written guidance, scheduled check-ins and occasional meetings can address some of these difficulties, but they require time and careful planning. Remote work is therefore not a way to eliminate the effort involved in managing a team. Without suitable support, delays and misunderstandings may offset the convenience employees gain at home.`,
`Despite these costs, the removal of routine travel creates a benefit that recurs throughout the working week. A worker with a long journey can recover time for rest or family responsibilities without reducing contracted working hours. This is more than a small improvement in comfort: it can make a demanding job compatible with responsibilities that would otherwise force someone to reduce their hours or leave employment. The gains are less certain for employees living close to the office or lacking a quiet workspace, which is why offering remote work as an option is preferable to requiring it for everyone.`,
`On balance, the recurring gains in time and flexibility outweigh the additional coordination costs when the role and home environment are suitable. Companies should preserve opportunities for collaboration and support those who need an office, but these qualifications do not undermine the overall value of allowing employees to work remotely.`],notes:['บอกเกณฑ์ daily benefits vs managed problems ตั้งแต่ต้น','รับว่าการแก้มีต้นทุน ไม่อ้างว่าประชุมออนไลน์แก้หมด','โยงเวลาที่คืนกับความสามารถทำงานต่อ และแยก option จาก requirement','ข้อสรุปมีเงื่อนไขที่วางไว้แล้ว ไม่เติมใหม่'],good:'แม่นยำขึ้นด้วย contracted working hours และไม่เหมารวมว่าบ้านทุกคนเหมาะกับทำงาน',limit:'ให้น้ำหนักผลดีต่อพนักงานมากกว่าผลลัพธ์ธุรกิจ การพัฒนาต่ออาจเชื่อมว่าบริษัทรักษาคนทำงานไว้ได้อย่างไร',upgrade:'ประเมินทั้งความถี่และความย้อนกลับได้ของข้อดีข้อเสีย พร้อมเชื่อมผลต่อทีม',criteria:['TR: ชั่งน้ำหนักด้วยต้นทุนและประโยชน์ที่อธิบาย','CC: each qualification เตรียมไว้ก่อนสรุป','LR: coordination costs / contracted working hours เจาะจง','GRA: คุมเงื่อนไขและ relative clause ได้หลากหลาย']},
{band:9,name:'ตีความคำว่า allowing • ประเมินทางเลือก',stance:'การเพิ่มทางเลือกให้ผลดีมากกว่าการบังคับอยู่บ้าน',paragraphs:[
`The growing willingness of employers to permit home working should be assessed as an expansion of choice, rather than as the abolition of the office. For tasks that can be performed remotely, its advantages generally outweigh its disadvantages: employees gain recurring control over time, while organisations can retain in-person contact where distance would otherwise impair the work.`,
`The strongest objection is that cooperation involves more than exchanging completed tasks. New staff learn by observing experienced colleagues, and a brief informal conversation can expose a misunderstanding before it becomes costly. When these interactions disappear, a team may function adequately in the short term while becoming less effective at developing its members. Regular video calls do not necessarily reproduce this learning. Employers must therefore identify activities that benefit from shared physical presence and make deliberate arrangements for them, rather than assume that digital communication is a complete substitute.`,
`Against this stands a substantial and repeated gain. Removing an unnecessary commute returns time to employees on every remote working day, without inherently reducing the time available for their duties. For someone balancing employment with caring responsibilities, that flexibility may determine whether remaining in the role is feasible. The employer can benefit too, by retaining a capable worker whose departure would require recruitment and training. This advantage need not depend on everyone finding home more productive than an office; it follows from allowing a suitable employee to organise work around constraints that do not diminish their ability to perform it.`,

function speakingCheck(){return `<section class="card"><h2>เช็กหลังพูด ห้ามหยุดแก้กลางคำตอบ</h2>${['ตอบคำถามตรงภายในประโยคแรก','มีเหตุผลหรือรายละเอียดอย่างน้อยหนึ่งจุด','ใช้ chunk เป็นหน่วย ไม่แปลทีละคำ','ออกเสียงคำลงท้ายและเว้นช่วงตามความหมาย','ถ้าติดคำ ใช้คำง่ายอธิบายต่อ','รอบสองเปลี่ยนรายละเอียดให้เป็นของตัวเอง'].map((x,i)=>`<label class="check step"><input type="checkbox" data-done="scheck-${i}" ${saved('done-scheck-'+i,false)?'checked':''}> ${x}</label>`).join('')}<div class="callout">Shadow → Copy → Personalise: ฟังเสียงตัวเองหรืออ่านต้นแบบตาม 2 รอบ จากนั้นปิดต้นแบบและเปลี่ยนคน สถานที่ เวลา หรือเหตุผลอย่างน้อย 2 จุด</div></section>`;}

function collocationPage(){const pool=collPool();collIndex=(collIndex+pool.length)%pool.length;const {x,i}=pool[collIndex];const topics=[...new Set(collocationRows.map(x=>x[0]))];return header('COLLOCATION / RECALL LAB','จำทั้งชุด แล้วบังคับใช้สองบริบท','คำศัพท์เดี่ยวไม่พอ ต้องรู้คำที่อยู่ด้วยกัน รูปประโยค และระดับภาษา')+`<div class="row spread"><label>หัวข้อ <select id="collTopic"><option value="all">ทั้งหมด</option>${topics.map(t=>`<option ${t===collTopic?'selected':''}>${t}</option>`).join('')}</select></label><span class="pill">${collIndex+1}/${pool.length}</span></div><section class="card flash"><div class="eyebrow">${x[0].toUpperCase()}</div><p>นึกชุดคำอังกฤษจากความหมายนี้</p><h2>${x[2]}</h2>${collReveal?`<div class="answer-box"><h2 class="english">${x[1]}</h2><p><b>Writing:</b> <span class="english">${x[3]}</span></p><p><b>Speaking:</b> <span class="english">${x[4]}</span></p></div>`:''}<button id="collReveal" class="primary">${collReveal?'ซ่อนคำตอบ':'เปิดคำตอบ'}</button></section><section class="card"><label class="field"><span>เรียกคืน: พิมพ์ชุดคำให้ตรง</span><input id="collAnswer" autocomplete="off"></label><button id="collCheck">ตรวจ</button><div id="collFeedback" class="feedback"></div><label class="field"><span>Transfer: แต่งประโยคใหม่เกี่ยวกับชีวิตหรือหัวข้ออื่น</span><textarea id="collSentence">${esc(saved('collSentence-'+i))}</textarea></label><div class="sticky-actions row spread"><button id="collPrev">← ก่อนหน้า</button><label class="check"><input type="checkbox" data-done="coll-${i}" ${saved('done-coll-'+i,false)?'checked':''}> เรียกคืนได้</label><button id="collNext">ถัดไป →</button></div></section><details><summary>วิธีท่องแบบ spaced retrieval</summary><div class="inside"><ol><li>วันนี้: นึก → เปิด → พูด 3 ครั้ง → แต่งใหม่</li><li>พรุ่งนี้: นึกก่อนเปิด ถ้าผิดกลับไปเริ่มรอบ</li><li>อีก 3 วัน: ใช้กับหัวข้อใหม่</li><li>อีก 7 วัน: พูดและเขียนโดยไม่ดู</li></ol><p>คำชุดนี้เป็นคลังที่ควรฝึก ไม่ใช่คำบังคับของข้อสอบ ใช้เมื่อความหมายตรงเท่านั้น</p></div></details>`;}
function dataPage(){return header('DATA / THIS DEVICE','สำรองและย้ายความคืบหน้า','ข้อมูลอยู่ใน localStorage ของเบราว์เซอร์นี้ จึงไม่ซิงก์จากคอมไปมือถืออัตโนมัติ')+`<section class="card"><h2>ส่งออกข้อมูลทั้งหมด</h2><p>รวมร่าง บันทึก คำที่จำได้ checklist ธีม และขนาดตัวอักษรเป็นไฟล์ JSON</p><button id="exportData" class="primary">ดาวน์โหลด writewise-backup.json</button></section><section class="card"><h2>นำเข้าบนอุปกรณ์อีกเครื่อง</h2><ol><li>ส่งไฟล์ JSON ไปมือถือ</li><li>เปิด Writewise ด้วยลิงก์เดิม</li><li>เลือกไฟล์ด้านล่าง แล้วกดนำเข้า</li></ol><label class="file-button">เลือกไฟล์ JSON<input id="importFile" type="file" accept="application/json" hidden></label><button id="importData">นำเข้าข้อมูล</button><div id="dataFeedback" class="feedback"></div></section><section class="card"><h2>เริ่มใหม่</h2><p>กดครั้งแรกเพื่อเตือน กดซ้ำภายใน 5 วินาทีเพื่อล้างข้อมูลการฝึกใน Writewise บนอุปกรณ์นี้</p><button id="clearData">ล้างข้อมูลทั้งหมด</button></section>`;}
function moveSpeak(delta){const max=speakTab==='part2'?cueCards.length:speakingTopics.length;speakIndex=(speakIndex+delta+max)%max;save('speakIndex',speakIndex);mirrorSeconds=60;render();}
function bindUpgrade(){document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{speakTab=b.dataset.stab;save('speakTab',speakTab);render();});document.querySelectorAll('[data-done]').forEach(c=>c.onchange=()=>{save('done-'+c.dataset.done,c.checked);render();});on('wlSelect','change',e=>{wlIndex=Number(e.target.value);save('wlIndex',wlIndex);render();});on('wlDraft','input',e=>save('wlDraft-'+wlIndex,e.target.value));on('wlPrev','click',()=>{wlIndex--;save('wlIndex',wlIndex);render();});on('wlNext','click',()=>{wlIndex++;save('wlIndex',wlIndex);render();});on('speakNote','input',e=>save('speakNote-'+speakIndex,e.target.value));on('cueNote','input',e=>save('cueNote-'+(speakIndex%cueCards.length),e.target.value));on('speakPrev','click',()=>moveSpeak(-1));on('speakNext','click',()=>moveSpeak(1));on('mirrorTimer','click',()=>{if(mirrorHandle){clearInterval(mirrorHandle);mirrorHandle=null;mirrorSeconds=60;render();return}mirrorHandle=setInterval(()=>{mirrorSeconds--;const b=$('mirrorTimer');if(b)b.textContent=mirrorSeconds>0?'เหลือ '+mirrorSeconds+' วินาที':'ครบเวลา ✓';if(mirrorSeconds<=0){clearInterval(mirrorHandle);mirrorHandle=null;}},1000);});on('collTopic','change',e=>{collTopic=e.target.value;collIndex=0;collReveal=false;save('collTopic',collTopic);render();});on('collReveal','click',()=>{collReveal=!collReveal;render();});on('collPrev','click',()=>{collIndex--;collReveal=false;render();});on('collNext','click',()=>{collIndex++;collReveal=false;render();});on('collSentence','input',e=>save('collSentence-'+collPool()[collIndex].i,e.target.value));on('collCheck','click',()=>{const target=collPool()[collIndex].x[1],a=$('collAnswer').value.trim().toLowerCase().replace(/\s+/g,' ');$('collFeedback').textContent=a===target.toLowerCase()?'ถูกต้อง ✓ พูดออกเสียง แล้วแต่งประโยคใหม่':'คำเป้าหมายคือ “'+target+'” · ดูรูปคำและบุพบทให้ครบ';});on('exportData','click',()=>{download('writewise-backup.json',JSON.stringify({app:'writewise',version:2,exportedAt:new Date().toISOString(),data:memory},null,2));toast('ดาวน์โหลดไฟล์สำรองแล้ว');});let pendingFile=null;on('importFile','change',e=>{pendingFile=e.target.files[0];$('dataFeedback').textContent=pendingFile?'เลือก '+pendingFile.name+' แล้ว':'ยังไม่ได้เลือกไฟล์';});on('importData','click',()=>{if(!pendingFile){$('dataFeedback').textContent='เลือกไฟล์ JSON ก่อน';return}const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(p.app!=='writewise'||!p.data||typeof p.data!=='object')throw Error();memory={...memory,...p.data};localStorage.setItem('writewise-v1',JSON.stringify(memory));$('dataFeedback').textContent='นำเข้าสำเร็จ กำลังโหลดใหม่…';setTimeout(()=>location.reload(),700);}catch(e){$('dataFeedback').textContent='ไฟล์ไม่ใช่ข้อมูลสำรอง Writewise ที่ถูกต้อง';}};reader.readAsText(pendingFile);});on('clearData','click',e=>{if(e.target.dataset.ready){localStorage.removeItem('writewise-v1');memory={};view='home';render();toast('ล้างข้อมูลแล้ว');}else{e.target.dataset.ready='1';e.target.textContent='กดอีกครั้งเพื่อล้างจริง';setTimeout(()=>{if(e.target){delete e.target.dataset.ready;e.target.textContent='ล้างข้อมูลทั้งหมด';}},5000);}});}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wc=s=>(s.match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g)||[]).length;
let memory={}; let storageOK=true;
try{memory=JSON.parse(localStorage.getItem('writewise-v1')||'{}');if(!memory||typeof memory!=='object'||Array.isArray(memory))memory={};}catch(e){storageOK=false;memory={};}
const saved=(k,d='')=>memory[k]??d;
function save(k,v){memory[k]=v;try{localStorage.setItem('writewise-v1',JSON.stringify(memory));}catch(e){storageOK=false;} }
let view=saved('lastView','home'),selected=0,band=7,comparison=false,showNotes=true,cardIndex=0,filter='all',flipped=false;
let timerLeft=2400,timerEnd=0,timerHandle=null;
const navs=[['home','⌂','เริ่มฝึกวันนี้'],['writinglab','W','Writing Pattern Lab'],['speaking','S','Speaking Mirror'],['collocations','C','Collocation Lab'],['learn','7–9','เทียบคำตอบ'],['foundation','A','พื้นฐานทีละขั้น'],['write','✎','ห้องเขียน'],['roadmap','28','แผน 28 วัน'],['data','⇅','ข้อมูลของฉัน'],['sources','↗','เกณฑ์ & อ้างอิง']];
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.handle);toast.handle=setTimeout(()=>$('toast').style.display='none',3500);}
function setView(v){view=v;save('lastView',v);render();$('main').focus();window.scrollTo({top:0,behavior:'instant'});}
function header(n,title,sub){return `<div class="eyebrow">${n}</div><h1>${title}</h1><p class="muted">${sub}</p>`;}
function selectLesson(){return `<label for="lesson">ชุดโจทย์</label><select id="lesson">${lessons.map((l,i)=>`<option value="${i}" ${i===selected?'selected':''}>${i+1}. ${l.title} · ${l.topic}</option>`).join('')}</select>`;}
function question(l){return `<section class="card question"><div class="row spread"><span class="eyebrow">PRACTICE QUESTION · แต่งเพื่อฝึก</span><span class="pill">Task 2 · อย่างน้อย 250 คำ</span></div><p class="english" lang="en">${l.prompt}</p><details><summary>แปลโจทย์ & แกะคำสั่ง</summary><div class="inside"><p>${l.translation}</p><div class="callout">${l.task}</div></div></details></section>`;}
function model(m,l){return `<article class="card model"><div class="row spread model-head"><div><div class="eyebrow">TARGET BAND ${m.band}</div><h2>${m.name}</h2></div><span class="pill">${wc(m.paragraphs.join(' '))} คำโดยประมาณ</span></div><p class="muted small">${m.stance}</p><div class="essay english" lang="en">${m.paragraphs.map((p,i)=>`<p>${esc(p)}</p>${showNotes?`<div class="annotation" lang="th"><b>ย่อหน้า ${i+1} ·</b> ${m.notes[i]}</div>`:''}`).join('')}</div><div class="analysis"><h3>อ่านแล้วเอาอะไรไปใช้</h3><p><strong>ข้อดี</strong> — ${m.good}</p><p><strong>ข้อจำกัด / ต้นทุนของวิธีนี้</strong> — ${m.limit}</p><p><strong>ฝึกต่อ</strong> — ${m.upgrade}</p><details><summary>วิเคราะห์ตามเกณฑ์ทั้ง 4 ด้าน</summary><div class="inside"><ul>${m.criteria.map(c=>`<li>${c}</li>`).join('')}</ul><p class="small muted">เป็นการวิเคราะห์เพื่อเรียนรู้ ไม่ใช่ใบคะแนนจากผู้ตรวจ</p></div></details></div></article>`;}
function learn(){const l=lessons[selected];return header('01 / COMPARE & NOTICE','โจทย์เดียวกัน เขียนให้ดีขึ้นอย่างไร','อ่านหนึ่งระดับให้เข้าใจ แล้วดูว่าระดับถัดไปเปลี่ยน “วิธีคิด” ตรงไหน')+`<div class="row spread no-print" style="margin-bottom:18px"><div class="row">${selectLesson()}</div><button data-go="foundation">พื้นฐานน้อย? เริ่มตรงนี้ ↗</button></div>`+question(l)+`<details><summary>คิดก่อนดูเฉลย · 2 นาที</summary><div class="inside"><label class="field"><span>${l.recall}</span><textarea id="recall" placeholder="ตอบภาษาไทยก่อนได้…">${esc(saved('recall-'+l.id))}</textarea></label><details><summary>ดูตัวอย่างกระบวนการคิด</summary><div class="inside"><ol>${l.plan.map(x=>`<li>${x}</li>`).join('')}</ol></div></details></div></details><div class="row spread"><div class="tabs" role="group" aria-label="ระดับตัวอย่าง">${[7,8,9].map(b=>`<button data-band="${b}" class="${band===b&&!comparison?'active':''}" aria-pressed="${band===b&&!comparison}">Band ${b}</button>`).join('')}<button id="compare" class="${comparison?'active':''}" aria-pressed="${comparison}">เทียบทั้ง 3</button></div><label class="check small"><input id="notes" type="checkbox" ${showNotes?'checked':''}>คำอธิบายรายย่อหน้า</label></div><p class="small muted">ตัวอย่างแต่งใหม่ตามคุณลักษณะของระดับเป้าหมาย ไม่ได้รับการรับรองคะแนนจาก IELTS; Band 7 ก็เป็นระดับสูงแล้ว ไม่จำเป็นต้องใส่ข้อผิดพลาดเพื่อทำให้เป็น Band 7</p><div class="${comparison?'compare':''}">${(comparison?l.models:l.models.filter(m=>m.band===band)).map(m=>model(m,l)).join('')}</div><section class="card"><div class="eyebrow">TRANSFER / ย้ายทักษะ</div><h2>เปลี่ยนหัวข้อ แต่ใช้วิธีคิดเดิม</h2><p class="english" lang="en">${l.transfer}</p><p class="muted">วงคำสั่ง → เลือกจุดยืน → อธิบายเหตุและผลหนึ่งชุด โดยไม่คัดลอกเหตุผลจากหัวข้อเดิม</p><button class="primary" id="transfer">เขียนโจทย์ใหม่นี้ →</button></section>`;}
function foundation(){return header('02 / BUILD THE BASE','จากประโยคหนึ่ง สู่เหตุผลหนึ่งย่อหน้า','ฝึกวันละ 25–40 นาทีตามกำลัง ช่วงเริ่มต้นยังไม่ต้องจับเวลา 40 นาทีทั้งบทความ')+`<div class="card"><h2>วงจรที่ใช้ทุกครั้ง</h2><div class="step"><b>1. อ่านคำสั่ง</b> — ต้องตอบกี่เรื่อง? ใคร? มีคำว่า all, more, allow หรือ require หรือไม่?</div><div class="step"><b>2. คิดเป็นไทย</b> — ฉันตอบว่าอะไร เพราะอะไร เหตุผลนี้เกิดขึ้นได้อย่างไร?</div><div class="step"><b>3. เขียนอังกฤษง่าย ๆ</b> — ประธาน + กริยา + ส่วนเติมเต็ม ให้ความหมายครบก่อน</div><div class="step"><b>4. ขยายให้คนอ่านเชื่อ</b> — เหตุผล → กลไก → ตัวอย่าง → ผลที่โยงกลับโจทย์</div><div class="step"><b>5. ปิดเฉลยแล้วเขียนใหม่</b> — ใช้หัวข้อใหม่ ทบทวนข้อผิดพลาดของตัวเองในวันถัดไป</div></div><div class="grid"><section class="card"><h2>ฐานประโยคที่ต้องแม่น</h2><p class="english" lang="en">Online courses <b>reduce</b> travel costs.<br>A recorded lesson <b>allows</b> students to review difficult material.</p><p>ประธานเอกพจน์ปัจจุบัน เช่น a lesson ใช้ allows; ประธานพหูพจน์ เช่น courses ใช้ reduce</p><p class="english" lang="en">Students can <b>study</b> at home.<br>This helps them <b>save</b> time.</p><p>หลัง can ใช้กริยารูปพื้นฐาน; help + คน + (to) กริยารูปพื้นฐาน</p></section><section class="card"><h2>เชื่อมเฉพาะเมื่อมีความสัมพันธ์</h2><p class="english" lang="en">Students save time <b>because they do not commute.</b></p><p>because + ประโยคครบ; because of + คำนาม เช่น because of long commutes</p><p class="english" lang="en"><b>Although online study is flexible,</b> some students need regular support.</p><p>Although ใช้เปิดข้อยอมรับ ไม่ต้องใส่ but ซ้ำในประโยคนี้ อย่าเขียน Although … เป็นประโยคโดด ๆ</p></section></div><section class="card" style="margin-top:18px"><h2>จาก “มีประโยชน์” ให้กลายเป็นเหตุผล</h2><p class="muted">สั้นเกินไป: Online learning is good and convenient.</p><p class="english" lang="en"><b>Claim:</b> Online courses can widen access to education.<br><b>Why:</b> Students do not need to live near a university.<br><b>Example:</b> A rural learner could attend lectures without relocating.<br><b>So what:</b> This removes a practical barrier to obtaining a degree.</p><div class="callout">โครง Claim → Why → Example → So what เป็นเครื่องฝึก ไม่ใช่จำนวนประโยคหรือสูตรบังคับของ IELTS ตัวอย่างสมมุติใช้ได้เมื่อสมเหตุสมผล ไม่ต้องแต่งสถิติหรืองานวิจัยขึ้นมา</div><label class="field"><span>ลองเขียน 3–4 ประโยค: “รถเมล์ที่เชื่อถือได้ช่วยคนทำงานอย่างไร”</span><textarea id="foundationDraft" placeholder="A reliable bus service can…">${esc(saved('foundationDraft'))}</textarea></label><details><summary>ดูตัวอย่างหลังลองเขียน</summary><div class="inside english" lang="en">A reliable bus service can improve access to employment. Workers who do not own a car can use it to reach workplaces outside their neighbourhood. For example, an early morning route could allow a shop assistant to arrive before the first shift begins. This makes a wider range of jobs practically available.</div></details></section><section class="card"><h2>ทดลองแก้ประโยค · เลือกแล้วอ่านเหตุผล</h2><p class="english" lang="en">Which sentence is correct?</p><div class="row"><button data-grammar="0">Students can studies at home.</button><button data-grammar="1">Students can study at home.</button><button data-grammar="2">Students can studying at home.</button></div><div id="grammarFeedback" class="feedback" role="status"></div><details><summary>พื้นฐานอีก 4 จุดที่พบบ่อย</summary><div class="inside"><ul><li>advice / information / feedback โดยทั่วไปเป็นนามนับไม่ได้: some advice ไม่ใช่ an advice</li><li>คำนามนับได้เอกพจน์ต้องมีตัวกำหนด: a student, the course ไม่ใช่ student needs course</li><li>ใช้ may / can เมื่อผลไม่ได้เกิดกับทุกคน: Remote work can reduce stress.</li><li>อย่าใช้ comma เชื่อมสองประโยคอิสระเฉย ๆ: Costs are high. Some students cannot enrol. หรือเชื่อมด้วย so</li></ul></div></details><button data-go="patterns" class="primary">ต่อไป: อ่านประเภทโจทย์ →</button></section>`;}
function patternPage(){return header('03 / PROMPT FIRST','จำหน้าที่ของย่อหน้า ไม่ท่องบทความ','หัวข้อ “เรียนออนไลน์” เหมือนกัน แต่เมื่อคำสั่งเปลี่ยน คำตอบต้องเปลี่ยนตาม')+patterns.map((p,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${p[0]}</summary><div class="inside"><p class="english" lang="en">${p[5]}</p><p><strong>มองหาคำสั่ง:</strong> ${p[1]}</p><div class="callout">${p[2]}</div><p class="english" lang="en">${esc(p[3])}</p><p class="small muted">แทนข้อความใน [ ] ด้วยความคิดที่ตอบโจทย์ ไม่จำเป็นต้องใช้ประโยคนี้ทุกครั้ง</p><p><strong>ระวัง:</strong> ${p[4]}</p></div></details>`).join('')+`<section class="card"><h2>เช็กว่าอ่านคำสั่งเป็นแล้วหรือยัง</h2><p class="english" lang="en">Do the advantages outweigh the disadvantages?</p><p>สิ่งใดจำเป็นที่สุดในคำตอบนี้?</p><div class="row"><button data-pattern="0">นับให้ข้อดีเยอะกว่าข้อเสีย</button><button data-pattern="1">ตัดสินน้ำหนักพร้อมเหตุผล</button><button data-pattern="2">พูดสองด้านโดยไม่เลือก</button></div><div id="patternFeedback" class="feedback" role="status"></div><p class="small muted">โครง 4 ย่อหน้าเป็นจุดเริ่มต้นที่สะดวก แต่ IELTS ไม่บังคับจำนวนย่อหน้า ให้การจัดย่อหน้าตามความคิดและความครบของคำตอบ</p></section>`;}
function filteredCards(){return vocab.map((v,i)=>({v,i})).filter(x=>filter==='all'||x.v[4]===filter);}
function vocabPage(){const pool=filteredCards();cardIndex=Math.min(cardIndex,pool.length-1);const {v,i}=pool[cardIndex];const known=vocab.filter((_,idx)=>saved('known-'+idx,false)).length;return header('04 / RETRIEVE, THEN APPLY','จำเป็นชุดคำ แล้วใช้ให้ตรงเรื่อง','ไม่มีคำชุดไหนที่ต้องใช้ทุกข้อสอบ เลือกจากความหมายที่ต้องการสื่อ และฝึกสร้างประโยคใหม่')+`<div class="row spread" style="margin-bottom:18px"><label>กลุ่มคำ <select id="vocabFilter">${[['all','ทั้งหมด'],['education','การศึกษา'],['transport','การเดินทาง'],['work','การทำงาน'],['general','ใช้ข้ามหัวข้อ'],['policy','นโยบาย'],['environment','สิ่งแวดล้อม']].map(([a,b])=>`<option value="${a}" ${filter===a?'selected':''}>${b}</option>`).join('')}</select></label><span class="pill">ทำเครื่องหมายจำได้ ${known} / ${vocab.length}</span></div><section class="card flash"><div class="eyebrow">CARD ${cardIndex+1} / ${pool.length}</div><p class="muted">${flipped?'คำและวิธีใช้':'นึกคำอังกฤษจากความหมาย ก่อนพลิกบัตร'}</p><h2 ${flipped?'lang="en"':''}>${flipped?v[0]:v[1]}</h2>${flipped?`<p>${v[1]}</p><p class="english" lang="en">${v[2]}</p><p class="small muted">${v[3]}</p>`:''}<div class="row" style="justify-content:center"><button id="flip" class="primary">${flipped?'ซ่อนคำตอบ':'พลิกดูคำตอบ'}</button></div></section><div class="row spread"><button id="prevCard">← ก่อนหน้า</button><button id="known">${saved('known-'+i,false)?'✓ จำได้แล้ว · กดเพื่อล้าง':'ทำเครื่องหมายว่าจำได้'}</button><button id="nextCard">ถัดไป →</button></div><section class="card" style="margin-top:20px"><h2>เรียกคืนจากความจำ</h2><p class="english" lang="en">${v[5]}</p><label class="field"><span>เติมชุดคำที่หายไป (ตรวจตรงกับบัตรนี้)</span><input id="vocabAnswer" type="text" autocapitalize="none" autocomplete="off" placeholder="พิมพ์คำอังกฤษ…"></label><button id="checkVocab">ตรวจคำตอบ</button><div id="vocabFeedback" class="feedback" role="status"></div><label class="field"><span>ใช้คำนี้เขียนประโยคใหม่ของคุณหนึ่งประโยค</span><textarea id="vocabSentence">${esc(saved('vocab-sentence-'+i))}</textarea></label><p class="small muted">ประโยคใหม่นี้เก็บไว้ให้ทบทวน ระบบไม่ได้ตรวจไวยากรณ์อัตโนมัติ</p></section><details><summary>เปิดคลังคำทั้งหมด 24 ชุด</summary><div class="inside">${vocab.map(v=>`<p><strong lang="en">${v[0]}</strong> — ${v[1]}<br><span class="small muted">${v[3]}</span></p>`).join('')}</div></details><div class="callout">แผนทบทวนที่แนะนำ: วันนี้ → พรุ่งนี้ → อีก 3 วัน → อีก 7 วัน ครั้งละ 5 คำ ต้องนึกก่อนเปิด และย้ายคำไปใช้ในหัวข้อใหม่ ปุ่ม “จำได้” เป็นบันทึกของคุณ ไม่ใช่ระบบนัดทบทวนอัตโนมัติ</div>`;}
function timerText(){return `${String(Math.floor(timerLeft/60)).padStart(2,'0')}:${String(timerLeft%60).padStart(2,'0')}`;}
function draftKey(){return 'draft-'+lessons[selected].id+(saved('transferMode',false)?'-transfer':'');}

function writePage(){const key=draftKey();return header('05 / YOUR WRITING DESK','คิดให้ครบ แล้วเขียนด้วยภาษาของคุณ','เริ่มจากย่อหน้าเดียวได้ เมื่อพร้อมค่อยฝึก 40 นาที: วางแผน 5 · เขียน 30 · ตรวจ 5')+`<div class="row" style="margin-bottom:18px">${selectLesson()}<label class="check small"><input id="transferMode" type="checkbox" ${saved('transferMode',false)?'checked':''}>โจทย์ใหม่สำหรับย้ายทักษะ</label></div><div class="card question"><p class="english" lang="en">${promptNow()}</p></div><details open><summary>วางแผน 5 นาที · ไทยก่อนได้</summary><div class="inside"><div class="grid"><label class="field"><span>จุดยืน + คำสั่งที่ต้องตอบ</span><textarea data-plan="position">${esc(saved(key+'-position'))}</textarea></label><label class="field"><span>เหตุผล 1 → กลไก → ตัวอย่าง</span><textarea data-plan="reason1">${esc(saved(key+'-reason1'))}</textarea></label><label class="field"><span>เหตุผล 2 / อีกด้าน → กลไก → ตัวอย่าง</span><textarea data-plan="reason2">${esc(saved(key+'-reason2'))}</textarea></label><label class="field"><span>ทำไมจุดยืนนี้มีน้ำหนักมากกว่า?</span><textarea data-plan="balance">${esc(saved(key+'-balance'))}</textarea></label></div></div></details><section class="card"><div class="row spread"><div class="row"><span class="stat" id="timer" role="timer" aria-label="เวลาที่เหลือ">${timerText()}</span><button id="startTimer">${timerHandle?'พักเวลา':'เริ่ม / ต่อเวลา'}</button><button id="resetTimer">ตั้งใหม่ 40 นาที</button></div><span class="pill" id="wordCount">${wc(saved(key))} คำโดยประมาณ</span></div><label class="field"><span class="screen-reader">บทความภาษาอังกฤษของฉัน</span><textarea id="draft" class="draft" lang="en" spellcheck="true" placeholder="เขียนบทนำ หรือเริ่มจากย่อหน้าเหตุผลหนึ่งย่อหน้าก่อน…">${esc(saved(key))}</textarea></label><p id="saveStatus" class="small muted" role="status">${storageOK?'บันทึกในเบราว์เซอร์เครื่องนี้ขณะพิมพ์ · ไม่ซิงก์ข้ามเครื่อง':'เบราว์เซอร์ไม่อนุญาตบันทึกถาวร · ดาวน์โหลดงานก่อนปิดหน้า'}</p><div class="row"><button class="primary" id="selfCheck">ตรวจความพร้อมเบื้องต้น</button><button id="exportDraft">ดาวน์โหลดงาน .txt</button></div><div id="draftFeedback" class="feedback" role="status"></div></section><section class="card"><h2>ตรวจด้วยตัวเอง 4 ด้าน</h2>${['TR · ตอบทุกคำถามและมีจุดยืนสม่ำเสมอ','CC · แต่ละย่อหน้ามีแกนเดียวและเรียงเหตุผลตามได้','LR · ชุดคำตรงความหมาย ไม่ยัดศัพท์ยากหรือใช้คำซ้ำพร่ำเพรื่อ','GRA · ตรวจประธาน–กริยา, a/the, เอกพจน์–พหูพจน์ และเครื่องหมายวรรคตอน','ทุกเหตุผลมีคำอธิบายหรือตัวอย่างที่เกี่ยวข้อง','บทสรุปตรงบทนำ และไม่มีเหตุผลใหม่ที่ยังไม่อธิบาย'].map((s,i)=>`<label class="check"><input data-check="${i}" type="checkbox" ${saved(key+'-check-'+i,false)?'checked':''}>${s}</label>`).join('')}<label class="field"><span>ข้อผิดพลาดที่ฉันจะไม่ทำซ้ำครั้งหน้า</span><textarea id="errorLog" placeholder="เช่น เขียน outweigh than ผิด → ใช้ outweigh + กรรมตรง">${esc(saved(key+'-errors'))}</textarea></label><p class="small muted">ระบบตรวจแค่จำนวนคำและการแบ่งย่อหน้า ไม่ประเมิน Band ไม่ตรวจความจริงหรือความถูกต้องทางภาษา การตรวจของเบราว์เซอร์อาจช่วยสะกดคำได้ตามการตั้งค่าเครื่อง</p></section>`;}
const weeks=[['สัปดาห์ 1 · ประโยคที่ถูกก่อน', ['เขียนแนะนำความเห็น 5 ประโยค และจดข้อที่ไม่มั่นใจ','ฝึกประธาน–กริยา 10 ประโยคจากหัวข้อการศึกษา','ฝึก because / because of อย่างละ 5 ประโยค','ฝึก although และแก้ fragment 5 ประโยค','เรียน collocation 5 ชุดแล้วแต่งประโยคใหม่','เขียนหนึ่งย่อหน้า Claim → Why → Example → So what','ปิดตัวอย่างแล้วเขียนย่อหน้าเดิมใหม่ ตรวจจุดผิด 3 จุด']],['สัปดาห์ 2 · อ่านโจทย์และขยายเหตุผล',['แยกคำสั่งทั้ง 7 แบบในหน้า Pattern','ฝึก thesis ให้โจทย์ positive/negative 3 แบบ','อ่านตัวอย่างเป้าหมาย 7 ชุดออนไลน์ แล้วสรุปโครงไทย','เทียบ 7 กับ 8: หา 3 จุดที่ข้ออ้างแม่นขึ้น','เขียน body สองย่อหน้าโดยไม่เปิดตัวอย่าง','ทบทวนคำเก่า + คำใหม่ 5 ชุด และใช้ในหัวข้อใหม่','เขียนทั้งบทความครั้งแรกแบบไม่จับเวลา']],['สัปดาห์ 3 · ครบคำสั่งและชั่งน้ำหนัก',['วิเคราะห์ discuss: เขียนเหตุผลของฝ่ายที่ไม่เห็นด้วย','อ่านชุดงบเดินทาง แล้วเขียนความเห็นของตัวเอง','เขียนบทความ discuss โดยใช้โครงที่ตัวเองวาง','วิเคราะห์ outweigh: เทียบผลกระทบ ไม่ใช่นับข้อ','อ่านชุดทำงานที่บ้าน แล้วหาเหตุผลที่คุณคิดต่าง','เขียน outweigh พร้อมหนึ่งประโยคชั่งน้ำหนักชัด ๆ','ตรวจงานสัปดาห์นี้ด้วยเกณฑ์ 4 ด้านและแก้หนึ่งบทความ']],['สัปดาห์ 4 · ย้ายทักษะและคุมเวลา',['ลองโจทย์ใหม่ทำงานจากบ้านแบบ positive/negative','ลองโจทย์วิชาการ vs ทักษะปฏิบัติแบบ discuss','ลองโจทย์ซื้อของออนไลน์แบบ outweigh','อ่านเป้าหมาย 9: ยืมหนึ่งวิธีคิดแล้วเขียนใหม่ด้วยคำง่าย','ฝึกทั้งบทความ 40 นาที ถ้ายังไม่พร้อมใช้ 50–60 นาที','แก้งานโดยเน้นข้อผิดพลาด 3 แบบที่ทำซ้ำ','เขียนโจทย์ใหม่แล้วเทียบกับงานวันแรก วางแผนรอบถัดไป']]];
function roadmap(){const count=Array.from({length:28},(_,i)=>saved('day-'+i,false)).filter(Boolean).length;return header('06 / A GENTLE ROUTINE','28 วันสร้างพื้นฐานที่ใช้ต่อได้','นี่เป็นแผนฝึกที่ออกแบบให้เริ่มลงมือ ไม่ใช่การรับประกันว่าจะได้ Band 7–9 ภายใน 28 วัน')+`<section class="card"><div class="row spread"><div><span class="stat">${count}</span><span class="muted"> / 28 วัน</span></div><p style="margin:0">10 นาทีทบทวน + 15 นาทีเขียน + 5 นาทีแก้</p></div><p class="small muted">วันที่เขียนเต็มบทความใช้เวลามากขึ้น ถ้ายังเขียนประโยคไม่ได้คล่อง ให้ทำสัปดาห์ 1 ซ้ำจนเขียนหนึ่งย่อหน้าเองได้</p></section>`+weeks.map((w,wi)=>`<section class="card"><h2>${w[0]}</h2>${w[1].map((s,i)=>`<label class="check"><input data-day="${wi*7+i}" type="checkbox" ${saved('day-'+(wi*7+i),false)?'checked':''}><span><b>วันที่ ${wi*7+i+1}</b> — ${s}</span></label>`).join('')}</section>`).join('')+`<div class="callout">ก่อนเพิ่มความยาก ให้ทำได้ 3 อย่าง: เขียนประโยคครบ · ขยายเหตุผลหนึ่งข้อ · อธิบายได้ว่าทุกย่อหน้าตอบคำถามใด ถ้ายังทำไม่ได้ ให้กลับไปฝึกจุดนั้นก่อน</div>`;}
function sources(){return header('REFERENCE / ABOUT','เข้าใจเกณฑ์ แล้วใช้โปรแกรมให้ถูกทาง','บทเรียนนี้เน้น Task 2 สำหรับ Academic และ General Training ยังไม่รวม Task 1')+`<section class="card"><h2>สิ่งที่ผู้ตรวจพิจารณา</h2><div class="table-wrap"><table class="source-table"><thead><tr><th>ด้าน</th><th>ถามตัวเอง</th><th>เป้าหมายการฝึก</th></tr></thead><tbody><tr><td>Task Response</td><td>ตอบสิ่งที่ถามครบไหม?</td><td>จุดยืนชัด เหตุผลเกี่ยวข้องและพัฒนา</td></tr><tr><td>Coherence & Cohesion</td><td>ผู้อ่านตามเหตุผลได้ไหม?</td><td>เรียงความคิด แบ่งย่อหน้า และเชื่อมความหมาย</td></tr><tr><td>Lexical Resource</td><td>คำตรงและเป็นธรรมชาติไหม?</td><td>ใช้คำยืดหยุ่น แม่นความหมายและ collocation</td></tr><tr><td>Grammatical Range & Accuracy</td><td>รูปประโยคหลากหลายและถูกไหม?</td><td>เลือกโครงสร้างตามความหมาย คุมข้อผิดพลาด</td></tr></tbody></table></div><p class="small muted" style="margin-top:16px">ทั้ง 4 ด้านมีน้ำหนักเท่ากันในการประเมินแต่ละงาน; ใน Writing ทั้งส่วน Task 2 มีน้ำหนักเป็นสองเท่าของ Task 1</p><p>แนวโน้มจาก 7 → 8 → 9 คือคำตอบพัฒนาได้ลึกและแม่นขึ้น อ่านลื่นขึ้น และควบคุมภาษาได้ยืดหยุ่นขึ้น ไม่ใช่เพียงจำนวนศัพท์ยาก</p><p>Task 2 ต้องเขียนอย่างน้อย 250 คำ โดยแนะนำใช้เวลาประมาณ 40 นาทีจาก Writing รวม 60 นาที จำนวนคำที่มากกว่าไม่ได้ทำให้ได้ Band สูงขึ้นเอง</p><p><a href="https://ielts.org/cdn/ielts-guides/ielts-writing-band-descriptors.pdf" target="_blank" rel="noopener">IELTS: Writing Band Descriptors (ปรับปรุง May 2023)</a><br><a href="https://ielts.org/take-a-test/test-types/ielts-academic-test/ielts-academic-format-writing" target="_blank" rel="noopener">IELTS: Academic Writing test format</a></p><p class="small muted">ตรวจแหล่งข้อมูลวันที่ 9 กันยายน 2026 · ลิงก์อ้างอิงต้องใช้อินเทอร์เน็ต · คำอธิบายและตัวอย่างในโปรแกรมแต่งใหม่เพื่อการเรียน</p></section><section class="card"><h2>วิธีใช้ใน iPad และแบ่งให้เพื่อน</h2><ol><li>ใช้ง่ายที่สุดผ่านลิงก์เว็บใน Safari ปรับ A− / A+ และโหมดแสงให้เหมาะกับตัวเอง</li><li>ไฟล์ index.html รวมทุกอย่างไว้แล้ว ไม่มีฟอนต์หรือสคริปต์ภายนอกที่ต้องโหลด เปิดออฟไลน์ได้ในเบราว์เซอร์ที่รองรับไฟล์ HTML</li><li>บน iPad แอป Files อาจเปิดเป็นตัวอย่างไฟล์ที่ไม่รันปุ่ม ให้ใช้เว็บที่ฝากไว้แทนการอ่านผ่าน Quick Look</li><li>การบันทึกอยู่เฉพาะเบราว์เซอร์และที่อยู่เว็บนั้น โหมดส่วนตัว การล้างข้อมูล หรือย้ายจากไฟล์ไปเว็บ อาจทำให้ไม่เห็นงานเดิม</li><li>ใช้ “ดาวน์โหลดงาน .txt” สำรองงานก่อนปิดหรือย้ายเครื่อง ไฟล์ HTML ที่แจกไม่มีร่างของคุณติดไปด้วย</li></ol><p>พื้นหลังสีเข้มและตัวอักษรปรับได้ช่วยเลือกสภาพอ่านที่สบายขึ้น แต่ไม่รับประกันว่าจะไม่ปวดตา ใช้ความสว่างหน้าจอที่เหมาะกับห้องและพักสายตาเมื่อไม่สบาย</p></section><section class="card"><h2>ขอบเขตที่โปรแกรมนี้ทำได้</h2><p>มีบทความเต็ม 9 ชิ้นใน 3 ชุดโจทย์ แบบฝึกพื้นฐาน Pattern 7 แบบ บัตรคำ 24 ชุด สมุดเขียนและแผน 28 วัน คะแนนเป้าหมายเป็นป้ายเพื่อเปรียบเทียบวิธีเขียน ไม่ใช่ผลตรวจจริง และโปรแกรมไม่ได้ใช้ AI ตรวจบทความ</p><p>หัวข้อเหล่านี้เป็นแบบฝึกทั่วไป ไม่ใช่การคาดการณ์ข้อสอบ บทเรียนไม่เกี่ยวข้องอย่างเป็นทางการกับ IELTS</p></section>`;}
function render(){const pages={home,writinglab:writingLabPage,speaking:speakingPage,collocations:collocationPage,learn,foundation,patterns:patternPage,vocab:vocabPage,write:writePage,roadmap,data:dataPage,sources:sourcesV2};if(!pages[view])view='home';$('nav').innerHTML=navs.map(([v,n,t])=>`<button class="navbtn ${view===v?'active':''}" data-go="${v}" ${view===v?'aria-current="page"':''}><span>${n}</span>${t}</button>`).join('');$('main').innerHTML=pages[view]()+`<footer>writewise · เรียนให้เข้าใจ ใช้ให้เป็น · ตัวอย่างเพื่อการฝึก ไม่ใช่การรับรอง Band</footer>`;bind();bindUpgrade();}
function on(id,event,fn){const e=$(id);if(e)e.addEventListener(event,fn);}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));on('lesson','change',e=>{selected=Number(e.target.value);render();});document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{band=Number(b.dataset.band);comparison=false;render();});on('compare','click',()=>{comparison=!comparison;render();});on('notes','change',e=>{showNotes=e.target.checked;render();});on('recall','input',e=>save('recall-'+lessons[selected].id,e.target.value));on('transfer','click',()=>{save('transferMode',true);setView('write');});on('foundationDraft','input',e=>save('foundationDraft',e.target.value));document.querySelectorAll('[data-grammar]').forEach(b=>b.onclick=()=>{$('grammarFeedback').textContent=b.dataset.grammar==='1'?'ถูกต้อง: หลัง can ใช้กริยารูปพื้นฐาน study แม้เปลี่ยนประธานเป็น He ก็ยังเป็น He can study.':'ลองใหม่: can + กริยารูปพื้นฐาน จึงต้องใช้ study ไม่เติม s หรือ ing';});document.querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>{$('patternFeedback').textContent=b.dataset.pattern==='1'?'ถูกต้อง: ต้องตัดสินว่าเหตุใดข้อดีจึงมี/ไม่มีน้ำหนักมากกว่าข้อเสีย เช่น ผลเกิดทุกวันและข้อเสียลดได้':'ยังไม่พอ: outweigh ถามเรื่องน้ำหนักผลกระทบ จึงต้องมีคำตัดสินและเหตุผลเปรียบเทียบ';});on('vocabFilter','change',e=>{filter=e.target.value;cardIndex=0;flipped=false;render();});on('flip','click',()=>{flipped=!flipped;render();});on('prevCard','click',()=>{cardIndex=(cardIndex-1+filteredCards().length)%filteredCards().length;flipped=false;render();});on('nextCard','click',()=>{cardIndex=(cardIndex+1)%filteredCards().length;flipped=false;render();});on('known','click',()=>{const i=filteredCards()[cardIndex].i;save('known-'+i,!saved('known-'+i,false));render();});on('checkVocab','click',()=>{const v=filteredCards()[cardIndex].v;const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'');const answer=$('vocabAnswer').value;$('vocabFeedback').textContent=!answer.trim()?'ลองนึกแล้วพิมพ์คำตอบก่อนครับ':norm(answer)===norm(v[0])?'ตรงกับบัตรนี้ ✓ ต่อไปลองใช้ในประโยคใหม่':'คำเป้าหมายของบัตรนี้คือ '+v[0]+' · คำอื่นอาจใช้ได้ตามบริบท ระบบนี้ตรวจเทียบกับบัตรเท่านั้น';});on('vocabSentence','input',e=>save('vocab-sentence-'+filteredCards()[cardIndex].i,e.target.value));on('transferMode','change',e=>{save('transferMode',e.target.checked);render();});document.querySelectorAll('[data-plan]').forEach(t=>t.oninput=()=>save(draftKey()+'-'+t.dataset.plan,t.value));on('draft','input',e=>{save(draftKey(),e.target.value);$('wordCount').textContent=wc(e.target.value)+' คำโดยประมาณ';$('saveStatus').textContent=storageOK?'บันทึกในเบราว์เซอร์เครื่องนี้แล้ว · ไม่ซิงก์ข้ามเครื่อง':'เก็บชั่วคราวในหน้านี้เท่านั้น · กรุณาดาวน์โหลดงานก่อนปิด';});document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>save(draftKey()+'-check-'+c.dataset.check,c.checked));on('errorLog','input',e=>save(draftKey()+'-errors',e.target.value));on('selfCheck','click',()=>{const t=$('draft').value;const words=wc(t);const paras=t.trim()?t.trim().split(/\n\s*\n/).length:0;$('draftFeedback').textContent=`${words} คำโดยประมาณ · ${paras} ย่อหน้าจากบรรทัดว่าง — ${words<250?'ถ้าฝึกบทความเต็ม ยังไม่ถึงขั้นต่ำ 250 คำ ให้ขยายเหตุผลที่จำเป็น':'ถึงขั้นต่ำจำนวนคำแล้ว แต่ยังต้องตรวจคุณภาพคำตอบ'}${paras<2?' · ลองแบ่งย่อหน้าตามแกนความคิด':''} · นี่ไม่ใช่คะแนน Band`;});on('exportDraft','click',()=>{const key=draftKey();download('writewise-'+lessons[selected].id+'.txt','WRITEWISE — MY PRACTICE\n\n'+promptNow()+'\n\nPLAN\n'+['position','reason1','reason2','balance'].map(x=>saved(key+'-'+x)).join('\n\n')+'\n\nESSAY\n'+saved(key)+'\n\nERROR LOG\n'+saved(key+'-errors'));toast('ส่งไฟล์งานให้เบราว์เซอร์ดาวน์โหลดแล้ว');});on('startTimer','click',()=>{if(timerHandle){timerLeft=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));clearInterval(timerHandle);timerHandle=null;}else{if(timerLeft<=0)timerLeft=2400;timerEnd=Date.now()+timerLeft*1000;timerHandle=setInterval(tick,500);}render();});on('resetTimer','click',()=>{clearInterval(timerHandle);timerHandle=null;timerLeft=2400;render();});document.querySelectorAll('[data-day]').forEach(c=>c.onchange=()=>{save('day-'+c.dataset.day,c.checked);render();});}
function tick(){timerLeft=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('timer'))$('timer').textContent=timerText();if(timerLeft===0){clearInterval(timerHandle);timerHandle=null;if($('startTimer'))$('startTimer').textContent='เริ่ม / ต่อเวลา';toast('ครบ 40 นาทีแล้ว · งานของคุณยังอยู่ เขียนต่อหรือตรวจงานได้');}}
document.addEventListener('visibilitychange',()=>{if(timerHandle)tick();});
let fontSize=Number(saved('fontSize',18));if(!Number.isFinite(fontSize))fontSize=18;fontSize=Math.max(16,Math.min(26,fontSize));function applySize(){document.documentElement.style.setProperty('--size',fontSize+'px');save('fontSize',fontSize);$('smaller').disabled=fontSize<=16;$('larger').disabled=fontSize>=26;}
const initialTheme=['night','dim','light'].includes(saved('theme'))?saved('theme'):'night';document.body.dataset.theme=initialTheme;$('theme').value=initialTheme;$('theme').onchange=e=>{document.body.dataset.theme=e.target.value;save('theme',e.target.value);};$('smaller').onclick=()=>{fontSize=Math.max(16,fontSize-2);applySize();};$('larger').onclick=()=>{fontSize=Math.min(26,fontSize+2);applySize();};applySize();render();

</script></body></html>
