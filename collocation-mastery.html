function rotateOptions(correct,wrong,pos){const a=wrong.slice(0,3);a.splice(pos,0,correct);return a;}
function corrupt(p){const w=p.split(' ');return [w.slice().reverse().join(' '),'do '+w.slice(1).join(' '),'make '+w.slice(1).join(' ')];}
function makeQuestion(topic,n){const item=topic.items[n%20],kind=n%12,type=kind%5,pos=(n+Math.floor(n/20))%4,candidates=topic.items.filter((_,i)=>i!==n%20),others=Array.from({length:3},(_,i)=>candidates[(n*3+i)%candidates.length][0]);let prompt,opts;
 if(type===0){prompt=`ข้อใดมีความหมายว่า “${item[1]}” มากที่สุด?`;opts=rotateOptions(item[0],others,pos);}
 else if(type===1){prompt=item[2].replace(new RegExp(item[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'______');opts=rotateOptions(item[0],others,pos);}
 else if(type===2){prompt=`เลือก collocation ที่ประกอบคำและบุพบทถูกต้อง: ${item[1]}`;opts=rotateOptions(item[0],corrupt(item[0]),pos);}
 else if(type===3){prompt='ข้อใดเป็นประโยคภาษาอังกฤษที่เป็นธรรมชาติที่สุด?';opts=rotateOptions(item[2],[...corrupt(item[0])].map(x=>item[2].replace(item[0],x)),pos);}
 else{prompt=`ถ้าต้องการสื่อเรื่อง “${item[1]}” ใน IELTS ควรเลือกกลุ่มคำใด?`;opts=rotateOptions(item[0],others,pos);}
 return{id:`${topic.id}-${n+1}`,topic:topic.id,type:MC_TYPES[kind],level:n<20?'Foundation':n<40?'Developing':'Transfer',prompt,thaiHint:`มองหากลุ่มคำที่เข้าคู่กันทั้งชุด ไม่แปลทีละคำ`,options:opts,correctIndex:pos,answer:item[0],explanation:`“${item[0]}” เป็นกลุ่มคำธรรมชาติที่ตรงกับความหมาย “${item[1]}”`,optionExplanations:opts.map((o,i)=>i===pos?'เป็นคำตอบที่ตรงความหมายและรูปคำ':'ไม่ใช่กลุ่มคำเป้าหมายที่เหมาะที่สุดในบริบทนี้'),writingExample:item[2],writingTranslation:item[3],speakingExample:`I think ${item[2].charAt(0).toLowerCase()+item[2].slice(1)}`,speakingTranslation:`ผมคิดว่า${item[3]}`,pattern:item[0]+' + ส่วนขยายตามบริบท',related:others.slice(0,2),memoryTip:`จำเป็นก้อนเสียง: ${item[0]} — ${item[1]}`,transferTask:`แต่งประโยคเกี่ยวกับชีวิตหรือประเทศไทยโดยใช้ “${item[0]}”`};}

function tabs(){return `<nav class="tabs" aria-label="โหมดฝึก">${[['home','ภาพรวม'],['learn','เรียนคำ'],['practice','ฝึก 50 ข้อ'],['review','ทบทวนข้อผิด'],['quick','Quick 20'],['mock','Mock 50'],['dashboard','สรุปผล']].map(x=>`<button data-go="${x[0]}" class="${mode===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav>`;}
function stats(){const rs=Object.values(ms.records),done=rs.filter(r=>r.attempts).length,first=rs.filter(r=>r.firstCorrect).length,wrong=rs.filter(r=>r.wrong).length,acc=done?Math.round(first/done*100):0,due=rs.filter(r=>r.wrong||Number(r.confidence||0)<3).length;return{done,first,wrong,acc,due};}
function homePage(){const s=stats(),last=MASTERY_TOPICS[topicIndex];return head('RECALL → CHOOSE → EXPLAIN → TRANSFORM','IELTS Collocation Mastery','เรียนเป็นกลุ่มคำ แล้วเรียกคืนใน Writing และ Speaking')+`<section class="card"><div class="stats"><div class="stat"><b>${s.done}</b>ทำแล้ว / 500</div><div class="stat"><b>${s.acc}%</b>ถูกครั้งแรก</div><div class="stat"><b>${s.due}</b>ควรทบทวน</div><div class="stat"><b>${Object.keys(ms.records).filter(k=>ms.records[k].sentence).length}</b>ประโยคของฉัน</div></div><div class="progress" style="margin-top:16px"><i style="width:${s.done/5}%"></i></div><p class="small muted">ความแม่นยำนี้เป็นสถิติการฝึก ไม่ใช่ IELTS Band</p><div class="row"><button class="primary" data-open-topic="${topicIndex}">เรียนต่อ: ${last.th} →</button><button data-go="quick">สุ่มฝึกวันนี้ 20 ข้อ</button><button data-go="review">ทบทวนข้อผิด</button></div></section><h2>10 หมวด · 200 collocations · 500 ข้อ</h2><div class="topics">${MASTERY_TOPICS.map((t,i)=>{const n=t.questions.filter(q=>ms.records[q.id]?.attempts).length;return `<button class="topic" data-open-topic="${i}"><b>${i+1}. ${t.title}</b><span>${t.th} · ${n}/50 ข้อ</span><div class="progress"><i style="width:${n*2}%"></i></div></button>`}).join('')}</div><section class="card callout"><b>รอบที่แนะนำ 20–30 นาที</b><p>เรียน 5 คำ → ทำ 10 ข้อ → พูดตัวอย่าง → แต่งประโยคใหม่ 1 ประโยค → ทบทวนคำที่ผิดในวันถัดไป</p></section>`;}
function learnPage(){const t=MASTERY_TOPICS[topicIndex],c=t.collocations[(learnIndex+t.collocations.length)%t.collocations.length];return head(`LEARN · ${t.title}`,c.phrase,c.thaiMeaning)+`<section class="card"><div class="row"><span class="pill">${learnIndex+1}/20</span><span class="pill">${c.type}</span><span class="pill">${c.register}</span></div><h2>รูปแบบ</h2><p class="english">${c.pattern}</p><p><b>บุพบท:</b> ${c.preposition}</p><div class="grid"><div><h2>Writing</h2><p class="english">${c.writingExample}</p><p>${c.writingTranslation}</p></div><div><h2>Speaking</h2><p class="english">${c.speakingExample}</p><p>${c.speakingTranslation}</p></div></div><div class="feedback"><b>จุดพลาดที่พบบ่อย</b><p>${c.commonMistake}</p><p><b>รูปที่ใช้:</b> <span class="english">${c.correction}</span></p></div><p><b>Trick:</b> ${c.memoryTip}</p><div class="memory"><span>นึก</span><span>เลือก</span><span>เข้าใจ</span><span>ลอก</span><span>เปลี่ยน</span><span>ทบทวน</span></div><label class="field"><span>พิมพ์กลุ่มคำหนึ่งครั้งจากความจำ</span><input id="learnCopy" autocomplete="off"></label><div id="copyFb" class="muted"></div><div class="sticky row"><button id="learnPrev">← ก่อนหน้า</button><button id="checkCopy">ตรวจการเรียกคืน</button><button id="learnNext">ถัดไป →</button><button class="primary" data-go="practice">ฝึกข้อสอบหมวดนี้</button></div></section>`;}
function poolForMode(){if(mode==='practice')return MASTERY_TOPICS[topicIndex].questions;if(mode==='review'||mode==='quick')return currentIds.map(id=>byId[id]).filter(Boolean);return[];}
function questionPage(){const pool=poolForMode();if(!pool.length)return head('REVIEW','ยังไม่มีข้อในคิว','ลองทำ Practice ก่อน แล้วข้อที่ผิดจะมาอยู่ที่นี่')+`<section class="card"><button class="primary" data-go="practice">เริ่ม Practice</button></section>`;qIndex=(qIndex+pool.length)%pool.length;const q=pool[qIndex],rec=ms.records[q.id]||{},locked=revealed;return head(`${mode.toUpperCase()} · ${MASTERY_TOPICS.find(t=>t.id===q.topic).title}`,`ข้อ ${qIndex+1} / ${pool.length}`,`${q.type} · ${q.level}`)+`<div class="progress"><i style="width:${(qIndex+1)/pool.length*100}%"></i></div><section class="card"><h2 class="english">${esc(q.prompt)}</h2>${hint?`<div class="callout"><b>คำใบ้:</b> ${q.thaiHint}</div>`:''}<div role="radiogroup" aria-label="ตัวเลือก">${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${revealed?(i===q.correctIndex?'correct':selected===i?'wrong':''):''}" data-choice="${i}" ${locked?'disabled':''}><strong>${'ABCD'[i]}.</strong><span class="english">${esc(o)}</span></button>`).join('')}</div><div class="row"><button id="showHint">ดูคำใบ้</button><button id="check" class="primary" ${selected===null?'disabled':''}>ตรวจคำตอบ</button>${wrongAttempt&&!revealed?'<button id="retry">ลองอีกครั้งโดยยังไม่ดูเฉลย</button><button id="reveal">เปิดเฉลยและเรียนรู้</button>':''}</div><div id="feedback" aria-live="polite"></div>${revealed?answerBlock(q,rec):''}<div class="sticky row"><button id="prevQ">← ก่อนหน้า</button><button id="nextQ">ข้อต่อไป →</button></div></section>`;}
function answerBlock(q,rec){return `<div class="answer"><div class="feedback"><b>${selected===q.correctIndex?'✓ ถูกต้อง':'คำตอบที่เหมาะที่สุด: '+('ABCD'[q.correctIndex])}</b><p>${q.explanation}</p></div><details><summary>ทำไมตัวเลือกอื่นไม่ใช่คำตอบที่ดีที่สุด</summary><div>${q.options.map((o,i)=>`<p><b>${'ABCD'[i]}.</b> ${q.optionExplanations[i]}</p>`).join('')}</div></details><div class="grid"><div><h2>Writing example</h2><p class="english">${q.writingExample}</p><p>${q.writingTranslation}</p></div><div><h2>Speaking example</h2><p class="english">${q.speakingExample}</p><p>${q.speakingTranslation}</p></div></div><p><b>Pattern:</b> <span class="english">${q.pattern}</span></p><p><b>Related:</b> <span class="english">${q.related.join(' · ')}</span></p><p><b>Trick:</b> ${q.memoryTip}</p><div class="callout"><b>Your turn:</b> ${q.transferTask}</div><label class="field"><span>ประโยคของฉัน</span><textarea id="mySentence">${esc(rec.sentence||'')}</textarea></label><p><b>ตอนนี้จำได้ระดับใด?</b></p><div class="row">${['ยังไม่เข้าใจ','จำได้แต่ยังใช้ไม่ได้','ใช้ได้เมื่อมีคำใบ้','ใช้ได้เอง'].map((x,i)=>`<button data-confidence="${i+1}" class="${Number(rec.confidence)===i+1?'active':''}">${x}</button>`).join('')}</div></div>`;}
function dashboardPage(){const s=stats();return head('DASHBOARD','ความคืบหน้าของฉัน','ข้อมูลเก็บในเบราว์เซอร์นี้และรวมอยู่ในไฟล์สำรอง Writewise')+`<section class="card"><div class="stats"><div class="stat"><b>${s.done}</b>ทำแล้ว</div><div class="stat"><b>${s.first}</b>ถูกครั้งแรก</div><div class="stat"><b>${s.wrong}</b>เคยตอบผิด</div><div class="stat"><b>${s.acc}%</b>ความแม่นยำ</div></div><div class="row" style="margin-top:16px"><button data-go="review">ทบทวน ${s.due} ข้อ</button><button data-go="quick">สุ่ม 20 ข้อ</button><button data-go="mock">สอบจำลอง 50 ข้อ</button><button id="exportAll">สำรอง JSON</button></div></section><section class="card"><h2>แยกตามหมวด</h2>${MASTERY_TOPICS.map((t,i)=>{const d=t.questions.filter(q=>ms.records[q.id]?.attempts).length,w=t.questions.filter(q=>ms.records[q.id]?.wrong).length;return `<div style="margin:14px 0"><div class="row"><b>${t.title}</b><span class="muted">${d}/50 · ผิด ${w}</span></div><div class="progress"><i style="width:${d*2}%"></i></div><button data-open-topic="${i}">เปิดหมวด</button><button data-reset-topic="${i}">รีเซ็ตหมวด</button></div>`}).join('')}</section>`;}
function startReview(){currentIds=allQuestions.filter(q=>{const r=ms.records[q.id];return r&&(r.wrong||Number(r.confidence||0)<3)}).map(q=>q.id);qIndex=0;}
function shuffled(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
function startQuick(){currentIds=shuffled(allQuestions).slice(0,20).map(q=>q.id);qIndex=0;}
function startMock(){if(ms.mock&&!ms.mock.submitted&&ms.mock.ids?.length===50){mockIndex=ms.mock.index||0;return}ms.mock={ids:shuffled(allQuestions).slice(0,50).map(q=>q.id),answers:{},flags:{},submitted:false,seconds:3000,timing:false,index:0};mockIndex=0;mockReview=false;save();}
function mockPage(){const m=ms.mock;if(!m)return '';if(m.submitted)return mockResult();const q=byId[m.ids[mockIndex]],ans=m.answers[q.id];if(mockReview)return mockReviewPage();return head('MOCK TEST · ไม่แสดงเฉลยก่อนส่ง',`ข้อ ${mockIndex+1} / 50`,`ตอบแล้ว ${Object.keys(m.answers).length} · เหลือ ${50-Object.keys(m.answers).length} · เวลา ${Math.floor(m.seconds/60)}:${String(m.seconds%60).padStart(2,'0')}`)+`<div class="progress"><i style="width:${(mockIndex+1)*2}%"></i></div><section class="card"><h2 class="english">${esc(q.prompt)}</h2>${q.options.map((o,i)=>`<button class="choice ${ans===i?'selected':''}" data-mock-choice="${i}"><strong>${'ABCD'[i]}.</strong><span class="english">${esc(o)}</span></button>`).join('')}<div class="sticky row"><button id="mockPrev">← ก่อนหน้า</button><button id="mockFlag">${m.flags[q.id]?'★ ทำเครื่องหมายแล้ว':'☆ กลับมาทำ'}</button><button id="timerToggle">${m.timing?'หยุดเวลา':'เริ่มจับเวลา'}</button><button id="mockNext">ถัดไป →</button><button id="mockReview">ตรวจคำตอบก่อนส่ง</button></div></section>`;}
function mockReviewPage(){const m=ms.mock,un=m.ids.filter(id=>m.answers[id]===undefined).length;return head('MOCK TEST','ตรวจคำตอบก่อนส่ง',`ตอบแล้ว ${50-un}/50 · ยังไม่ตอบ ${un}`)+`<section class="card"><div class="review-grid">${m.ids.map((id,i)=>`<button data-jump="${i}" class="${m.answers[id]!==undefined?'answered':''} ${m.flags[id]?'flag':''}">${i+1}</button>`).join('')}</div><p class="small muted">พื้นหลังเขียว = ตอบแล้ว · กรอบทอง = ทำเครื่องหมายกลับมาดู</p><div class="row"><button id="backMock">กลับไปทำต่อ</button><button id="submitMock" class="primary">ส่งคำตอบ</button></div></section>`;}
function mockResult(){const m=ms.mock,correct=m.ids.filter(id=>m.answers[id]===byId[id].correctIndex).length;return head('MOCK RESULT',`${correct} / 50`,`คะแนนแบบฝึก ไม่ใช่ IELTS Band`)+`<section class="card"><div class="stats"><div class="stat"><b>${correct}</b>ถูก</div><div class="stat"><b>${50-correct}</b>ควรทบทวน</div><div class="stat"><b>${correct*2}%</b>ความแม่นยำ</div><div class="stat"><b>${Math.floor((3000-m.seconds)/60)}</b>นาทีที่ใช้</div></div><button id="newMock" class="primary">เริ่ม Mock ชุดใหม่</button><button data-go="review">ทบทวนข้อผิด</button><details><summary>ดูเฉลยทั้งชุด</summary>${m.ids.map((id,i)=>{const q=byId[id],ok=m.answers[id]===q.correctIndex;return `<p><b>${i+1}. ${ok?'✓':'✗'} ${q.answer}</b><br><span class="small">${q.explanation}</span></p>`}).join('')}</details></section>`;}
function render(){document.body.dataset.theme=ms.theme||'night';document.documentElement.style.setProperty('--fs',(ms.font||18)+'px');$('theme').value=ms.theme||'night';const page=mode==='home'?homePage():mode==='learn'?learnPage():(['practice','review','quick'].includes(mode)?questionPage():mode==='dashboard'?dashboardPage():mode==='mock'?mockPage():homePage());$('app').innerHTML=tabs()+page+`<p class="small muted">แบบฝึกแต่งขึ้นเพื่อการศึกษา ไม่ใช่ข้อสอบจริง ไม่ได้รับรองคะแนนจาก IELTS และไม่มี collocation ชุดใดที่จำเป็นต้องใช้ในทุกคำตอบ</p>`;bind();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open-topic]').forEach(b=>b.onclick=()=>{topicIndex=Number(b.dataset.openTopic);qIndex=0;learnIndex=0;mode='learn';save();render();});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);render();});document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{const q=poolForMode()[qIndex];ms.records[q.id].confidence=Number(b.dataset.confidence);ms.records[q.id].reviewAt=Date.now()+[0,86400000,259200000,604800000][Number(b.dataset.confidence)-1];save();render();});$('showHint')&&($('showHint').onclick=()=>{hint=true;render();});$('check')&&($('check').onclick=()=>checkAnswer());$('retry')&&($('retry').onclick=()=>{selected=null;wrongAttempt=false;render();});$('reveal')&&($('reveal').onclick=()=>{revealed=true;recordAnswer(false);render();});$('prevQ')&&($('prevQ').onclick=()=>moveQ(-1));$('nextQ')&&($('nextQ').onclick=()=>moveQ(1));$('mySentence')&&($('mySentence').oninput=e=>{const q=poolForMode()[qIndex];ms.records[q.id].sentence=e.target.value;save();});$('learnPrev')&&($('learnPrev').onclick=()=>{learnIndex=(learnIndex+19)%20;save();render();});$('learnNext')&&($('learnNext').onclick=()=>{learnIndex=(learnIndex+1)%20;save();render();});$('checkCopy')&&($('checkCopy').onclick=()=>{$('copyFb').textContent=$('learnCopy').value.trim().toLowerCase()===MASTERY_TOPICS[topicIndex].collocations[learnIndex].phrase.toLowerCase()?'ถูกต้อง ✓':'ยังไม่ตรง ลองอ่านเป็นก้อนเสียงแล้วพิมพ์อีกครั้ง';});document.querySelectorAll('[data-reset-topic]').forEach(b=>b.onclick=()=>{const t=MASTERY_TOPICS[Number(b.dataset.resetTopic)];if(confirm(`ล้างผลการฝึกหมวด ${t.title} ในเครื่องนี้?`)){t.questions.forEach(q=>delete ms.records[q.id]);save();render();}});$('exportAll')&&($('exportAll').onclick=exportData);bindMock();}
function recordAnswer(correct){const q=poolForMode()[qIndex],r=ms.records[q.id]||{attempts:0,firstCorrect:null,wrong:false};r.attempts++;if(r.firstCorrect===null)r.firstCorrect=correct;if(!correct)r.wrong=true;r.lastAnswer=selected;r.lastAt=Date.now();ms.records[q.id]=r;save();}
function checkAnswer(){if(selected===null)return;const q=poolForMode()[qIndex],ok=selected===q.correctIndex;recordAnswer(ok);if(ok)revealed=true;else wrongAttempt=true;$('live').textContent=ok?'ตอบถูก':'ยังไม่ถูก';render();}
function moveQ(d){const p=poolForMode();qIndex=(qIndex+d+p.length)%p.length;selected=null;revealed=false;hint=false;wrongAttempt=false;save();render();}
function bindMock(){const m=ms.mock;if(!m)return;document.querySelectorAll('[data-mock-choice]').forEach(b=>b.onclick=()=>{m.answers[m.ids[mockIndex]]=Number(b.dataset.mockChoice);save();render();});$('mockPrev')&&($('mockPrev').onclick=()=>{mockIndex=(mockIndex+49)%50;m.index=mockIndex;save();render();});$('mockNext')&&($('mockNext').onclick=()=>{mockIndex=(mockIndex+1)%50;m.index=mockIndex;save();render();});$('mockFlag')&&($('mockFlag').onclick=()=>{const id=m.ids[mockIndex];m.flags[id]=!m.flags[id];save();render();});$('mockReview')&&($('mockReview').onclick=()=>{mockReview=true;render();});$('backMock')&&($('backMock').onclick=()=>{mockReview=false;render();});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{mockIndex=Number(b.dataset.jump);mockReview=false;render();});$('submitMock')&&($('submitMock').onclick=()=>{const un=m.ids.filter(id=>m.answers[id]===undefined).length;if(un&&!confirm(`ยังไม่ได้ตอบ ${un} ข้อ ต้องการส่งหรือไม่?`))return;m.submitted=true;m.timing=false;clearInterval(timerHandle);m.ids.forEach(id=>{const q=byId[id],ok=m.answers[id]===q.correctIndex,r=ms.records[id]||{attempts:0,firstCorrect:null,wrong:false};r.attempts++;if(r.firstCorrect===null)r.firstCorrect=ok;if(!ok)r.wrong=true;ms.records[id]=r;});save();render();});$('timerToggle')&&($('timerToggle').onclick=()=>{m.timing=!m.timing;if(m.timing){clearInterval(timerHandle);timerHandle=setInterval(()=>{m.seconds=Math.max(0,m.seconds-1);if(m.seconds===0){clearInterval(timerHandle);m.timing=false;}save();render();},1000);}else clearInterval(timerHandle);save();render();});$('newMock')&&($('newMock').onclick=()=>{delete ms.mock;startMock();render();});}
function exportData(){const blob=new Blob([JSON.stringify({app:'writewise',version:2,exportedAt:new Date().toISOString(),data:memory},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='writewise-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('theme').onchange=e=>{ms.theme=e.target.value;save();render();};$('minus').onclick=()=>{ms.font=Math.max(16,(ms.font||18)-1);save();render();};$('plus').onclick=()=>{ms.font=Math.min(26,(ms.font||18)+1);save();render();};render();
</script></body></html>
